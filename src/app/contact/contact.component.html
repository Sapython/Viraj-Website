<section id="contact">
    <h2 id="heading">Contact</h2>
    <div id="container">
        <div id="contact-items">
            <div class="contact-item">
                <h5 class="contact-item-heading">Email</h5>
                <p class="contact-item-paragraph"><a href="mailto:info@nggon.com">info@nggon.com</a></p>
            </div>
            <div class="contact-item">
                <h5 class="contact-item-heading">Phone</h5>
                <p class="contact-item-paragraph"><a href="tel:+86(406)555-0120">+86 (406) 555-0120</a></p>
            </div>
        </div>
        <form action="" method="post" id="message-form">
            <input type="text" name="name" placeholder="Full Name" class="message-form-input">
            <input type="email" name="email" placeholder="Email Address" class="message-form-input">
            <textarea name="message" placeholder="Message" rows="4" class="message-form-input"></textarea>
            <button type="submit" id="message-form-submit">Send Message</button>
        </form>
    </div>
</section>
