<section>
  <table *ngIf="filteredCustomers.length > 0">
    <thead>
      <tr>
        <th width="10%"></th>
        <th width="30%">Customer Name</th>
        <th width="10%">Age</th>
        <th width="20%">Gross Purchase</th>
        <th width="30%"></th>
      </tr>
    </thead>
    <tbody id="customer-rows">
      <tr *ngFor="let customer of filteredCustomers" class="customer-row">
        <td><img [src]="customer.image" /></td>
        <td>{{ customer.name }}</td>
        <td>{{ getAge(customer.dob) }}</td>
        <td>₹{{ customer.grossPurchase }}</td>
        <td class="right">
          <div class="buttons">
            <button class="primary-btn" [routerLink]="customer.id">
              <i class="fa-solid fa-eye"></i>View
            </button>
            <button class="primary-btn" (click)="editCustomer(customer)">
              <i class="fa-solid fa-pen-to-square"></i>Edit
            </button>
            <button
              class="primary-btn"
              uk-toggle="target: #confirm-delete-modal"
            >
              <i class="fa-solid fa-trash"></i>Delete
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="filteredCustomers.length == 0">No Customers :(</p>
</section>

<div id="customer-modal" uk-modal>
  <div class="uk-modal-dialog uk-modal-body">
    <h2 *ngIf="!editMode" class="uk-modal-title">Add Customer</h2>
    <h2 *ngIf="editMode" class="uk-modal-title">Edit Customer</h2>
    <button class="uk-modal-close-default" type="button" uk-close></button>
    <form [formGroup]="customerForm" (ngSubmit)="addCustomer()">
      <div id="upload-photo-wrapper" (click)="photoInput.click()">
        <div id="upload-photo-container">
          <img src="assets/img/ri_image-edit-fill.png" />
          <p *ngIf="!editMode && photoInput.files?.length != 1">Upload Photo</p>
          <p *ngIf="editMode || photoInput.files?.length == 1">Change Photo</p>
          <input type="file" (change)="imageSelected()" #photoInput />
        </div>
      </div>
      <div id="customer-inputs">
        <div class="customer-form-box">
          <label for="name-input" class="admin-label">Name</label>
          <input
            type="text"
            id="name-input"
            formControlName="name"
            class="admin-input"
          />
        </div>
        <div class="customer-form-box">
          <label for="dob-input" class="admin-label">Date of Birth</label>
          <input
            type="date"
            id="dob-input"
            formControlName="dob"
            class="admin-input"
          />
        </div>
        <div class="customer-form-box">
          <label class="admin-label">Gender</label>
          <select class="admin-input" formControlName="gender">
            <option ngValue="male">Male</option>
            <option ngValue="female">Female</option>
            <option ngValue="other">Other</option>
          </select>
        </div>
        <div class="customer-form-box">
          <label for="gross-purchase-input" class="admin-label"
            >Gross Purchase</label
          >
          <div id="gross-purchase-input-container">
            <span>₹</span>
            <input
              type="number"
              class="admin-input"
              formControlName="grossPurchase"
              id="gross-purchase-input"
            />
          </div>
        </div>
        <div class="customer-form-box">
          <label for="phone-number-input" class="admin-label"
            >Phone Number</label
          >
          <input
            type="tel"
            id="phone-number-input"
            formControlName="phoneNumber"
            class="admin-input"
          />
        </div>
        <div class="customer-form-box">
          <label for="email-input" class="admin-label">Email</label>
          <input
            type="email"
            id="email-input"
            formControlName="email"
            class="admin-input"
          />
        </div>
        <div class="customer-form-box">
          <label for="address-input" class="admin-label">Address</label>
          <input
            type="text"
            id="address-input"
            formControlName="address"
            class="admin-input"
          />
        </div>
        <div class="customer-form-box">
          <label for="job-input" class="admin-label">Job</label>
          <input
            type="text"
            id="job-input"
            formControlName="job"
            class="admin-input"
          />
        </div>
      </div>
      <button
        *ngIf="!editMode"
        (disabled)="(!customerForm.valid)"
        type="submit"
        class="primary-btn"
      >
        Add Customer
      </button>
      <button
        *ngIf="editMode"
        (disabled)="(!customerForm.valid)"
        type="submit"
        class="primary-btn"
      >
        Save Changes
      </button>
    </form>
  </div>
</div>

<app-confirm-delete-modal
  (confirmDelete)="deleteCustomer()"
></app-confirm-delete-modal>
