<div id="card">
  <img src="{{ recipeImage }}" alt="Photo of {{ recipeName }}" loading="lazy" />
  <div id="card-content">
    <div>
      <h3>{{ recipeName }}</h3>
      <p>{{ recipeType }}</p>
    </div>
    <div id="price">₹{{ recipePrice }}</div>
    <div id="buttons">
      <button class="primary-btn" [routerLink]="recipeId">View</button>
      <button class="primary-btn" (click)="requestEdit.emit()">Edit</button>
      <button class="primary-btn" uk-toggle="#confirm-delete-modal">Delete</button>
    </div>
  </div>
</div>
