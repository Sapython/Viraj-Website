

<section id="recipe-card">

  <div id="image">
    <img src='{{recipeImage}}' alt='{{recipeTitle}}' />
    
  </div>
  <div id="dish-description">
    <b> {{recipeTitle}}</b>
    <p>{{recipeDesc}}</p>
  </div>
  <div id="buttons">
    <button id="edit">
      <b>Edit</b>
      <img src="../../../../assets/img/edit.svg" alt="dish" />
    </button>
    <button id="remove" 
     >
      <b>Remove</b>
      <img src="../../../../assets/img/trash.svg" alt="dish" />
    </button>
  </div>
</section>
