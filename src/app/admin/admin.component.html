<header>
  <button
    *ngIf="!largeScreen"
    class="uk-navbar-toggle"
    uk-navbar-toggle-icon
    id="toggle-button"
    (click)="toggleSidebar()"
  ></button>
  <h2 id="header-heading">Agent {{ currentPanel }}</h2>
  <div *ngIf="currentPanel == 'Stock'" id="header-end">
    <button class="admin-button" uk-toggle="target: #update-stock-modal">
      <span uk-icon="icon: plus"></span> Update Stock
    </button>
    <button class="admin-button" uk-toggle="target: #item-modal">
      <span uk-icon="icon: plus"></span> Add Item
    </button>
  </div>
  <div *ngIf="currentPanel == 'Tasks'" id="header-end">
    <button class="admin-button" uk-toggle="target: #task-modal">
      <span uk-icon="icon: plus"></span> Add Task
    </button>
  </div>
  <div *ngIf="currentPanel == 'Recipes'" id="header-end">
    <button class="admin-button"  uk-toggle="target: #recipe-modal">
      <span uk-icon="icon: plus"></span> Add Recipe
    </button>
  </div>
  <div *ngIf="currentPanel == 'Employees'" id="header-end">
    <div class="search-box">
      <input type="text" class="admin-search" placeholder="Search" />
      <span uk-icon="icon: search"></span>
    </div>
    <button class="admin-button">
      <span uk-icon="icon: plus"></span> Add Employee
    </button>
  </div>
  <div *ngIf="currentPanel == 'Customers'" id="header-end">
    <div class="search-box">
      <input type="text" class="admin-search" placeholder="Search" />
      <span uk-icon="icon: search"></span>
    </div>
    <button class="admin-button">
      <span uk-icon="icon: plus"></span> Add Customer
    </button>
  </div>
</header>
<div id="wrapper" (window:resize)="onWindowResize()">
  <div
    [style]="largeScreen || showSidebar ? '' : 'display: none'"
    id="sidebar-container"
  >
    <aside id="sidebar">
      <ul id="sidebar-ul">
        <li>
          <a
            routerLink="/admin/dashboard"
            routerLinkActive="active"
            class="sidebar-li-a"
            (click)="toggleSidebar()"
            ><span uk-icon="icon: thumbnails" class="sidebar-icon"></span
            ><span class="sidebar-text">Dashboard</span></a
          >
        </li>
        <li>
          <a
            routerLink="/admin/stock"
            routerLinkActive="active"
            class="sidebar-li-a"
            (click)="toggleSidebar()"
            ><span uk-icon="icon: bag" class="sidebar-icon"></span
            ><span class="sidebar-text">Stock</span></a
          >
        </li>
        <li>
          <a
            routerLink="/admin/tasks"
            routerLinkActive="active"
            class="sidebar-li-a"
            (click)="toggleSidebar()"
            ><span uk-icon="icon: list" class="sidebar-icon"></span
            ><span class="sidebar-text">Tasks</span></a
          >
        </li>
        <li>
          <a
            routerLink="/admin/recipes"
            routerLinkActive="active"
            class="sidebar-li-a"
            (click)="toggleSidebar()"
            ><span uk-icon="icon: heart" class="sidebar-icon"></span
            ><span class="sidebar-text">Recipes</span></a
          >
        </li>
        <li>
          <a
            routerLink="/admin/employees"
            routerLinkActive="active"
            class="sidebar-li-a"
            (click)="toggleSidebar()"
            ><span uk-icon="icon: users" class="sidebar-icon"></span
            ><span class="sidebar-text">Employees</span></a
          >
        </li>
        <li>
          <a
            routerLink="/admin/customers"
            routerLinkActive="active"
            class="sidebar-li-a"
            (click)="toggleSidebar()"
            ><span uk-icon="icon: happy" class="sidebar-icon"></span
            ><span class="sidebar-text">Customers</span></a
          >
        </li>
      </ul>
    </aside>
  </div>
  <main (click)="showSidebar && toggleSidebar()">
    <router-outlet></router-outlet>
  </main>
</div>
