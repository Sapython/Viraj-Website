<section>
  <table>
    <thead>
      <tr>
        <th width="10%"></th>
        <th width="30%">Item Name</th>
        <th width="10%">Quantity</th>
        <th width="10%">Unit</th>
        <th width="10%">Rate</th>
        <th width="30%"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td><img [src]="item.image" /></td>
        <td>{{ item.name }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.unit }}</td>
        <td>₹{{ item.rate }}/{{ item.unit }}</td>
        <td class="right">
          <div class="buttons">
            <button class="primary-btn" (click)="editItem(item)">
              <i class="fa-solid fa-pen-to-square"></i>Edit
            </button>
            <button
              class="primary-btn"
              uk-toggle="target: #confirm-delete-modal"
            >
              <i class="fa-solid fa-trash"></i>Delete
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</section>

<div id="item-modal" uk-modal>
  <div class="uk-modal-dialog uk-modal-body">
    <h2 *ngIf="!editMode" class="uk-modal-title">Add New Item</h2>
    <h2 *ngIf="editMode" class="uk-modal-title">Edit Item</h2>
    <button class="uk-modal-close-default" type="button" uk-close></button>
    <form [formGroup]="itemForm" (ngSubmit)="addItem()">
      <div id="item-form-content">
        <div id="upload-photo-wrapper" (click)="photoInput.click()">
          <div id="upload-photo-container">
            <img src="assets/img/ri_image-edit-fill.png" />
            <p *ngIf="!editMode && photoInput.files?.length != 1">
              Upload Photo
            </p>
            <p *ngIf="editMode || photoInput.files?.length == 1">
              Change Photo
            </p>
            <input type="file" (change)="imageSelected()" #photoInput />
          </div>
        </div>
        <div id="item-inputs">
          <div class="item-form-box">
            <label class="admin-label" for="name-input">Name</label>
            <input
              type="text"
              class="admin-input"
              formControlName="name"
              id="name-input"
            />
          </div>
          <div class="item-form-box">
            <label class="admin-label" for="quantity-input">Quantity</label>
            <input
              type="number"
              min="0"
              class="admin-input"
              formControlName="quantity"
              id="quantity-input"
            />
          </div>
          <div class="item-form-box">
            <label class="admin-label" for="rate-input">Rate (₹)</label>
            <input
              type="number"
              min="0"
              class="admin-input"
              formControlName="rate"
              id="rate-input"
            />
          </div>
          <div class="item-form-box">
            <label class="admin-label">Unit</label>
            <select class="admin-input" formControlName="unit">
              <option ngValue="g">Grams (g)</option>
              <option ngValue="kg">Kilograms (kg)</option>
              <option ngValue="l">Litre (L)</option>
              <option ngValue="mL">Millilitre (mL)</option>
            </select>
          </div>
        </div>
      </div>
      <button
        *ngIf="!editMode"
        (disabled)="(!itemForm.valid)"
        type="submit"
        class="primary-btn"
      >
        Add Item
      </button>
      <button
        *ngIf="editMode"
        (disabled)="(!itemForm.valid)"
        type="submit"
        class="primary-btn"
      >
        Save Changes
      </button>
    </form>
  </div>
</div>

<div id="update-stock-modal" uk-modal>
  <div class="uk-modal-dialog uk-modal-body">
    <h2 class="uk-modal-title">Update Stock</h2>
    <button class="uk-modal-close-default" type="button" uk-close></button>
    <div class="search-box">
      <input
        type="text"
        class="admin-search"
        placeholder="Search"
        (input)="searchItems()"
        #itemSearchInput
      />
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <form [formGroup]="updateStockForm" (ngSubmit)="updateStock()">
      <div id="stock-items">
        <div class="stock-item" *ngFor="let item of filteredItems">
          <div class="flex-subcontainer">
            <img [src]="item.image" />
            <p>{{ item.name }}</p>
          </div>
          <div class="flex-subcontainer">
            <input type="number" [formControlName]="item.id" min="0" />
            <p class="stock-item-unit">{{ item.unit }}</p>
          </div>
        </div>
      </div>
      <button type="submit" class="primary-btn">Update Stock</button>
    </form>
  </div>
</div>

<app-confirm-delete-modal
  (confirmDelete)="deleteItem()"
></app-confirm-delete-modal>
